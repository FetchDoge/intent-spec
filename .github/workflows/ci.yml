name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validator core path
        run: python -m unittest tests.test_validator -v
      - name: Claims integrity
        run: python3 scripts/check_claims.py
